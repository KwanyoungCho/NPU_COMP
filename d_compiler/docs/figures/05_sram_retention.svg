<text x="139.3572443181818" y="526" font-size="15" text-anchor="middle" font-weight="normal">1548</text>
<text x="321.1754261363636" y="526" font-size="15" text-anchor="middle" font-weight="normal">9740</text>
<text x="684.8117897727273" y="526" font-size="15" text-anchor="middle" font-weight="normal">26124</text>
<text x="1048.448153409091" y="526" font-size="15" text-anchor="middle" font-weight="normal">42508</text>
<path d="M866,326 L866,403" fill="none" stroke="#4b5b70" stroke-width="2.5"/>
<polygon points="866,403 861.0,392.0 871.0,392.0" fill="#4b5b70"/>
<text x="880" y="364.5" font-size="15" text-anchor="start" font-weight="normal">same H allocation</text>
<text x="105" y="565" font-size="20" text-anchor="start" font-weight="normal">H is written directly into its retained region. No H GSTORE / GLOAD is emitted.</text>
<text x="105" y="603" font-size="18" text-anchor="start" font-weight="normal">Y reuses dead X storage. W2 reuses dead W1 storage. Addresses are bytes.</text>
<text x="45" y="662" font-size="16" text-anchor="start" font-weight="normal">SRAM peak 42,508 bytes; capacity 45,056 bytes. The narrow first region includes scratch/constants.</text>
</g></svg>
