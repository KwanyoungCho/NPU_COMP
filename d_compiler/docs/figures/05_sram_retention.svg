<g font-family="DejaVu Sans,Arial,sans-serif" fill="#142239">
<text x="45" y="52" font-size="30" text-anchor="start" font-weight="bold">05  Two kernels can share H in SRAM</text>
<text x="45" y="89" font-size="17" text-anchor="start" font-weight="normal">Recorded 44 KiB example | X[64,64] @ W1[64,128] = H; H @ W2[128,64] = Y</text>
<text x="105" y="180" font-size="22" text-anchor="start" font-weight="bold">Kernel 1: produce H</text>
