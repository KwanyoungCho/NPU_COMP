<text x="122.1786221590909" y="459.15" font-size="19" text-anchor="middle" font-weight="normal"></text>
<rect x="139.3572443181818" y="410" width="181.8181818181818" height="85" rx="12" fill="#cceafb" stroke="#66758b" stroke-width="1.5"/>
<text x="230.26633522727272" y="459.15" font-size="19" text-anchor="middle" font-weight="normal">Y</text>
<rect x="321.1754261363636" y="410" width="363.6363636363636" height="85" rx="12" fill="#ffe1b8" stroke="#66758b" stroke-width="1.5"/>
<text x="502.99360795454544" y="459.15" font-size="19" text-anchor="middle" font-weight="normal">W2</text>
<rect x="684.8117897727273" y="410" width="363.6363636363636" height="85" rx="12" fill="#e2d9ff" stroke="#66758b" stroke-width="1.5"/>
