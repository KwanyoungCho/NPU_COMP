<text x="122.1786221590909" y="259.15" font-size="19" text-anchor="middle" font-weight="normal"></text>
<rect x="139.3572443181818" y="210" width="181.8181818181818" height="85" rx="12" fill="#cceafb" stroke="#66758b" stroke-width="1.5"/>
<text x="230.26633522727272" y="259.15" font-size="19" text-anchor="middle" font-weight="normal">X</text>
<rect x="321.1754261363636" y="210" width="363.6363636363636" height="85" rx="12" fill="#ffe1b8" stroke="#66758b" stroke-width="1.5"/>
<text x="502.99360795454544" y="259.15" font-size="19" text-anchor="middle" font-weight="normal">W1</text>
<rect x="684.8117897727273" y="210" width="363.6363636363636" height="85" rx="12" fill="#e2d9ff" stroke="#66758b" stroke-width="1.5"/>
<text x="866.629971590909" y="259.15" font-size="19" text-anchor="middle" font-weight="normal">H</text>
<rect x="1048.448153409091" y="210" width="56.551846590909086" height="85" rx="12" fill="#edf0f5" stroke="#66758b" stroke-width="1.5"/>
<text x="1076.7240767045455" y="259.15" font-size="19" text-anchor="middle" font-weight="normal"></text>
<text x="139.3572443181818" y="326" font-size="15" text-anchor="middle" font-weight="normal">1548</text>
<text x="321.1754261363636" y="326" font-size="15" text-anchor="middle" font-weight="normal">9740</text>
<text x="684.8117897727273" y="326" font-size="15" text-anchor="middle" font-weight="normal">26124</text>
<text x="1048.448153409091" y="326" font-size="15" text-anchor="middle" font-weight="normal">42508</text>
<text x="105" y="380" font-size="22" text-anchor="start" font-weight="bold">Kernel 2: consume H</text>
