<text x="600.0" y="589.15" font-size="19" text-anchor="middle" font-weight="normal">Small kernel/model checks exist. End-to-end quantized generation is not validated.</text>
<text x="45" y="662" font-size="16" text-anchor="start" font-weight="normal">See the quantization appendix for scale layout, workspace constraints and historical test scope.</text>
