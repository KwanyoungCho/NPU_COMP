<rect x="45" y="370" width="310" height="120" rx="12" fill="#ffe1b8" stroke="#66758b" stroke-width="1.5"/>
<text x="200.0" y="407.65" font-size="19" text-anchor="middle" font-weight="normal">W8A8</text>
<text x="200.0" y="436.65" font-size="19" text-anchor="middle" font-weight="normal">Quantize X per group</text>
<text x="200.0" y="465.65" font-size="19" text-anchor="middle" font-weight="normal">INT8 W + INT8 X</text>
<rect x="445" y="370" width="310" height="120" rx="12" fill="#e2d9ff" stroke="#66758b" stroke-width="1.5"/>
<text x="600.0" y="422.15" font-size="19" text-anchor="middle" font-weight="normal">64-element INT8 dot</text>
<text x="600.0" y="451.15" font-size="19" text-anchor="middle" font-weight="normal">INT32 group sum</text>
<rect x="845" y="370" width="310" height="120" rx="12" fill="#cceafb" stroke="#66758b" stroke-width="1.5"/>
<text x="1000.0" y="422.15" font-size="19" text-anchor="middle" font-weight="normal">Apply scales</text>
<text x="1000.0" y="451.15" font-size="19" text-anchor="middle" font-weight="normal">FP32 sum -&gt; FP16</text>
<path d="M355,430 L445,430" fill="none" stroke="#4b5b70" stroke-width="2.5"/>
