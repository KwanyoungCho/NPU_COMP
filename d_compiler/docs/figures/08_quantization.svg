<g font-family="DejaVu Sans,Arial,sans-serif" fill="#142239">
<text x="45" y="52" font-size="30" text-anchor="start" font-weight="bold">08  Quantization is a separate validation track</text>
<text x="45" y="89" font-size="17" text-anchor="start" font-weight="normal">Weights stored as INT8 do not imply that every calculation is INT8</text>
<rect x="45" y="175" width="310" height="100" rx="12" fill="#ffe1b8" stroke="#66758b" stroke-width="1.5"/>
<text x="200.0" y="217.15" font-size="19" text-anchor="middle" font-weight="normal">W8A16</text>
<text x="200.0" y="246.15" font-size="19" text-anchor="middle" font-weight="normal">INT8 W + FP16 X</text>
<rect x="445" y="175" width="310" height="100" rx="12" fill="#cceafb" stroke="#66758b" stroke-width="1.5"/>
<text x="600.0" y="217.15" font-size="19" text-anchor="middle" font-weight="normal">Dequantize W</text>
<text x="600.0" y="246.15" font-size="19" text-anchor="middle" font-weight="normal">FP16 tile in SRAM</text>
<rect x="845" y="175" width="310" height="100" rx="12" fill="#e2d9ff" stroke="#66758b" stroke-width="1.5"/>
<text x="1000.0" y="217.3" font-size="18" text-anchor="middle" font-weight="normal">FP16 matrix multiply</text>
<text x="1000.0" y="245.3" font-size="18" text-anchor="middle" font-weight="normal">FP32 accumulation</text>
<path d="M355,225 L445,225" fill="none" stroke="#4b5b70" stroke-width="2.5"/>
