<text x="600.0" y="551.3" font-size="18" text-anchor="middle" font-weight="normal">DMA panel size may cover many 64x64 tiles; it is a separate schedule choice.</text>
<text x="45" y="662" font-size="16" text-anchor="start" font-weight="normal">Current automatic M_MUL path uses activation OFF. Fusion must preserve the numeric contract.</text>
