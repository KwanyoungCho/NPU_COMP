<g font-family="DejaVu Sans,Arial,sans-serif" fill="#142239">
<text x="45" y="52" font-size="30" text-anchor="start" font-weight="bold">04  K accumulation and FP16 boundaries</text>
<text x="45" y="89" font-size="17" text-anchor="start" font-weight="normal">X[64,128] @ B[128,64] = P[64,64] | two K tiles, one output tile</text>
<rect x="45" y="175" width="330" height="100" rx="12" fill="#e2d9ff" stroke="#66758b" stroke-width="1.5"/>
<text x="210.0" y="217.15" font-size="19" text-anchor="middle" font-weight="normal">X[:,0:64] @ B[0:64,:]</text>
<text x="210.0" y="246.15" font-size="19" text-anchor="middle" font-weight="normal">M_MUL: accumulate = 0</text>
<rect x="435" y="175" width="330" height="100" rx="12" fill="#e2d9ff" stroke="#66758b" stroke-width="1.5"/>
<text x="600.0" y="217.3" font-size="18" text-anchor="middle" font-weight="normal">X[:,64:128] @ B[64:128,:]</text>
<text x="600.0" y="245.3" font-size="18" text-anchor="middle" font-weight="normal">M_MUL: accumulate = 1</text>
<rect x="825" y="175" width="330" height="100" rx="12" fill="#cceafb" stroke="#66758b" stroke-width="1.5"/>
<text x="990.0" y="217.15" font-size="19" text-anchor="middle" font-weight="normal">SAVE</text>
<text x="990.0" y="246.15" font-size="19" text-anchor="middle" font-weight="normal">P to SRAM as FP16</text>
<path d="M375,225 L435,225" fill="none" stroke="#4b5b70" stroke-width="2.5"/>
<polygon points="435,225 424.0,230.0 424.0,220.0" fill="#4b5b70"/>
