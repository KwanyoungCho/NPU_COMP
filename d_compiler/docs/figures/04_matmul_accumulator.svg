<text x="990.0" y="382.15" font-size="19" text-anchor="middle" font-weight="normal">Add / SiLU after all K</text>
<text x="990.0" y="411.15" font-size="19" text-anchor="middle" font-weight="normal">FP16 stage boundaries</text>
<path d="M990,275 L990,345" fill="none" stroke="#4b5b70" stroke-width="2.5"/>
