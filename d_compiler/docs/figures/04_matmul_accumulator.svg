<rect x="45" y="345" width="720" height="90" rx="12" fill="#e2d9ff" stroke="#66758b" stroke-width="1.5"/>
<text x="405.0" y="396.65" font-size="19" text-anchor="middle" font-weight="normal">FP32 accumulator stays inside the matrix unit across K</text>
<path d="M210,275 L210,345" fill="none" stroke="#4b5b70" stroke-width="2.5"/>
<polygon points="210,345 205.0,334.0 215.0,334.0" fill="#4b5b70"/>
